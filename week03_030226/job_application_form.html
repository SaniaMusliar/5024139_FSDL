<!DOCTYPE html>
<html lang="en">
<head>
    <title>Job Application Form</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- 🔹 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Career Portal</a>
    </div>
</nav>

<!-- 🔹 BREADCRUMB -->
<div class="container mt-3">
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item">Home</li>
            <li class="breadcrumb-item active">Job Application</li>
        </ol>
    </nav>
</div>

<!-- 🔹 JUMBOTRON / HEADER -->
<div class="container mt-3">
    <div class="p-4 bg-primary text-white rounded text-center">
        <h3>Apply for Your Dream Job</h3>
        <p class="mb-0">Fill in the details carefully</p>
    </div>
</div>

<!-- 🔹 FORM CARD -->
<div class="container mt-4 mb-5">
    <div class="card shadow">
        <div class="card-header text-center bg-secondary text-white">
            <h4>Job Application Form</h4>
        </div>

        <div class="card-body">
            <form>

                <!-- Personal Details -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control">
                    </div>
                </div>

                <!-- Email & Phone -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control">
                    </div>
                </div>

                <!-- Position -->
                <div class="mb-3">
                    <label class="form-label">Position Applied For</label>
                    <select class="form-select">
                        <option>Select position</option>
                        <option>Web Developer</option>
                        <option>UI/UX Designer</option>
                        <option>Data Analyst</option>
                        <option>Software Tester</option>
                    </select>
                </div>

                <!-- Experience -->
                <div class="mb-3">
                    <label class="form-label">Experience (in years)</label>
                    <input type="number" class="form-control">
                </div>

                <!-- Skills -->
                <div class="mb-3">
                    <label class="form-label">Skills</label>
                    <textarea class="form-control" rows="3"></textarea>
                </div>

                <!-- Resume Upload -->
                <div class="mb-3">
                    <label class="form-label">Upload Resume</label>
                    <input type="file" class="form-control">
                </div>

                <!-- Buttons -->
                <div class="text-center">
                    <button type="submit" class="btn btn-success px-4">Submit</button>
                    <button type="reset" class="btn btn-danger px-4 ms-2">Reset</button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- 🔹 FOOTER -->
<div class="container text-center mb-4">
    <hr>
    <p>
        <b>HR Contact</b><br>
        Email: hr@company.com | Phone: 0251-2687452
    </p>
</div>

</body>
</html>
