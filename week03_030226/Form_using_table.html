<!DOCTYPE html>
<html lang="en">
<head>
    <title>Beneficiary Registration</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- 🔹 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Beneficiary Portal</a>
    </div>
</nav>

<!-- 🔹 BREADCRUMB -->
<div class="container mt-3">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">Home</li>
            <li class="breadcrumb-item active">Registration</li>
        </ol>
    </nav>
</div>

<!-- 🔹 JUMBOTRON (Announcement) -->
<div class="container mt-3">
    <div class="p-4 bg-warning rounded text-center">
        <h4>📢 Announcement</h4>
        <p class="mb-0">
            Last date for registration is <b>31st March 2026</b>.  
            Please submit the form before the deadline.
        </p>
    </div>
</div>

<!-- 🔹 FORM SECTION -->
<div class="container mt-4 mb-5">
    <div class="card shadow">
        <div class="card-header text-center bg-primary text-white">
            <h3>Registration Form</h3>
        </div>

        <div class="card-body">
            <form>

                <!-- Grid System -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control">
                    </div>
                </div>

                <!-- Gender -->
                <div class="mb-3">
                    <label class="form-label">Gender</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender">
                        <label class="form-check-label">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender">
                        <label class="form-check-label">Female</label>
                    </div>
                </div>

                <!-- Email & Phone -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control">
                    </div>
                </div>

                <!-- DOB -->
                <div class="mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" class="form-control">
                </div>

                <!-- Address -->
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control">
                </div>

                <!-- Parents -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Father Name</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mother Name</label>
                        <input type="text" class="form-control">
                    </div>
                </div>

                <!-- Upload -->
                <div class="mb-3">
                    <label class="form-label">Upload Photograph</label>
                    <input type="file" class="form-control">
                    <small class="text-danger">
                        File size ≤ 70KB | jpeg, jpg, png
                    </small>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control">
                </div>

                <!-- Buttons -->
                <div class="text-center">
                    <button type="submit" class="btn btn-success px-4">Submit</button>
                    <button type="reset" class="btn btn-danger px-4 ms-2">Reset</button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- 🔹 CONTACT SECTION -->
<div class="container text-center mb-4">
    <hr>
    <p>
        <b>Contact Us</b><br>
        Email: support_beneficiary@gmail.com<br>
        Phone: +91 98765 43210
    </p>
</div>

</body>
</html>
