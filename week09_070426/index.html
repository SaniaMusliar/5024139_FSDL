<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <title>AngularJS Stylish Hello</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #dbeafe, #fce7f3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #ffffff;
            padding: 60px 50px;
            border-radius: 25px;
            width: 480px; /* increased size */
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.01);
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #222;
        }

        p {
            font-size: 15px;
            color: #666;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 8px rgba(99,102,241,0.3);
        }

        .output {
            margin-top: 30px;
            font-size: 24px;
            font-weight: 500;
            color: #4f46e5;
        }

        /* mobile friendly */
        @media (max-width: 500px) {
            .card {
                width: 90%;
                padding: 40px 25px;
            }
        }
    </style>
</head>

<body ng-controller="myController">

    <div class="card">
        <h1>Hello There 👋</h1>
        <p>Type your name and see the magic ✨</p>

        <input type="text" ng-model="name" placeholder="Enter your name">

        <div class="output">
            Hello, {{name || "Stranger"}} 💜
        </div>
    </div>

    <script>
        var app = angular.module("myApp", []);

        app.controller("myController", function($scope) {
            $scope.name = "";
        });
    </script>

</body>
</html>
